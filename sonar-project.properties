# SonarQube Project Configuration for Frontend
sonar.projectKey=Interview-frontend
sonar.projectName=Interview-frontend
sonar.language=js

# Sources & Tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/.test.js,**/.test.jsx,**/.test.ts,**/.test.tsx
sonar.sourceEncoding=UTF-8

# Coverage Report Path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude UI files from coverage (but not from bug analysis) so they don't drag average to 0%
# This ensures that our 100% logic coverage is actually visible instead of being buried in a 1% average.
#sonar.coverage.exclusions=src/components/**,src/pages/**,src/hooks/**,src/contexts/**,src/features/**,src/store/**,src/schemas/**,**/ShadDemo.jsx,**/main.jsx,**/App.jsx

# General exclusions
sonar.exclusions=coverage/**
